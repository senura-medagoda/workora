server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  docker:
    compose:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      max-lifetime: 240000

management:
  endpoint:
    health:
      probes:
        enabled: true

workora:
  security:
    cookie-secure: true