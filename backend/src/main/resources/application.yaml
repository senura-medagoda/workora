spring:
  application:
    name: workora-api
  profiles:
    default: dev          # used only if no profile is set explicitly (production will set one)
  jpa:
    open-in-view: false   # avoids lazy-loading in the web layer, a known anti-pattern
    hibernate:
      ddl-auto: validate  # Hibernate checks the schema but never changes it
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

workora:
  security:
    jwt-secret: ${WORKORA_JWT_SECRET}   # no default on purpose: production must provide it
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: true                 # cookies only over HTTPS (dev overrides this)