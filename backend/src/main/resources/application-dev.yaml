spring:
  docker:
    compose:
      lifecycle-management: start_only   # starts the DB, leaves it running when the app stops

logging:
  level:
    com.workora: DEBUG

workora:
  security:
    jwt-secret: dev-only-secret-change-me-0123456789abcdef
    cookie-secure: false                # localhost is plain http

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true